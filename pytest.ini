[pytest]
testpaths = tests
# Live tests call the real iNaturalist; they only run with:  pytest -m live
addopts = -m "not live"
markers =
    live: calls the real iNaturalist API (needs internet; run with  pytest -m live)
filterwarnings =
    # Harmless notice from the FastAPI/Starlette test client; nothing to do on our side.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
